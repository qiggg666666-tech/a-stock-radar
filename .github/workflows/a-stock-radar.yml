          - macd-resonance-screener
          - first-red-macd-combo
          - first-red-sector-combo
          - dip-buy-screener
          - dupont-roe-screener
          - vcp-screener
          - vcp-screener-a
          - vcp-screener-b
          - vcp-screener-c
          - vcp-screener-d
          - bull-confirm-screener
