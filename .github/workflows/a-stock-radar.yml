        description: "年线v7数据截至日期 YYYY-MM-DD；留空按北京时间当天运行"
        required: false
        default: ""
        type: string
      strategy_notifications:
        description: "三类四分片策略完成后发送单条汇总通知；定时运行默认开启"
        required: false
        default: true
