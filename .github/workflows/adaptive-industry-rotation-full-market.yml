# 独立自适应行业轮动：共同股票池 → A-D分片 → 统一权重汇总。
# 08:45 UTC = 工作日北京时间16:45。数据源异常会写入artifact，不阻断汇总审计。
name: Adaptive Industry Rotation Full Market

on:
  schedule:
    - cron: "45 8 * * 1-5"
  workflow_dispatch:
    inputs:
      signal_date:
        description: "固定信号日（YYYY-MM-DD；留空使用北京时间当前工作日）"
        required: false
        default: ""
      min_average_turnover_wan:
        description: "最低20日平均成交额（万元）"
        required: false
        default: "3000"

permissions:
  contents: read

concurrency:
  group: adaptive-industry-rotation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  MIN_AVERAGE_TURNOVER_WAN: ${{ inputs.min_average_turnover_wan || '3000' }}

jobs:
  prepare-universe:
    name: 准备独立全市场共同股票池
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signal_date: ${{ steps.signal-date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare baostock pandas numpy tabulate
      - name: 确定同日信号日
        id: signal-date
        env:
          INPUT_SIGNAL_DATE: ${{ inputs.signal_date || '' }}
        run: |
          SIGNAL_DATE="${INPUT_SIGNAL_DATE}"
          if [ -z "$SIGNAL_DATE" ]; then
            TODAY="$(TZ=Asia/Shanghai date +%F)"
            WEEKDAY="$(TZ=Asia/Shanghai date +%u)"
            if [ "$WEEKDAY" -eq 6 ]; then SIGNAL_DATE="$(TZ=Asia/Shanghai date -d "$TODAY -1 day" +%F)";
            elif [ "$WEEKDAY" -eq 7 ]; then SIGNAL_DATE="$(TZ=Asia/Shanghai date -d "$TODAY -2 day" +%F)";
            else SIGNAL_DATE="$TODAY"; fi
          fi
          echo "value=$SIGNAL_DATE" >> "$GITHUB_OUTPUT"
      - name: 自检并生成共同股票池
        run: |
          python -m py_compile adaptive_industry_rotation_universe.py a_share_adaptive_industry_rotation_research.py adaptive_industry_rotation_summary.py
          python adaptive_industry_rotation_universe.py --self-test
          python a_share_adaptive_industry_rotation_research.py --self-test
          python adaptive_industry_rotation_universe.py \
            --signal-date "${{ steps.signal-date.outputs.value }}" \
            --output output/adaptive_industry_rotation_universe.json \
            --provider-timeout-seconds 45 --source auto --retries 2
      - name: 上传共同股票池
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-industry-rotation-universe
          path: output/adaptive_industry_rotation_universe.json
          retention-days: 30
          if-no-files-found: warn

  scan:
    name: 自适应行业轮动全市场 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { shard: A, index: 0 }
          - { shard: B, index: 1 }
          - { shard: C, index: 2 }
          - { shard: D, index: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: adaptive-industry-rotation-universe
          path: input
      - name: 校验共同股票池
        run: test -s input/adaptive_industry_rotation_universe.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖与脚本自检
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare pandas numpy tabulate
          python -m py_compile a_share_adaptive_industry_rotation_research.py
          python a_share_adaptive_industry_rotation_research.py --self-test
      - name: 扫描共同股票池分片
        run: |
          python a_share_adaptive_industry_rotation_research.py \
            --universe-file input/adaptive_industry_rotation_universe.json \
            --shard-index "${{ matrix.index }}" --shard-count 4 \
            --signal-date "${{ needs.prepare-universe.outputs.signal_date }}" \
            --min-average-turnover-wan "$MIN_AVERAGE_TURNOVER_WAN" \
            --request-pause-seconds 0.20 --retries 1 --provider-timeout-seconds 35 \
            --output-dir "output/shard-${{ matrix.index }}"
      - name: 上传分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-industry-rotation-${{ matrix.shard }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: 自适应行业轮动全市场汇总
    runs-on: ubuntu-latest
    needs: [prepare-universe, scan]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare pandas numpy tabulate
      - name: 下载共同股票池和A-D分片
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: adaptive-industry-rotation-*
          path: collected
          merge-multiple: false
      - name: 全局统一权重与汇总
        run: |
          python adaptive_industry_rotation_summary.py \
            --artifacts-dir collected --expected-shards 4 --top 120 \
            --output-dir output
      - name: 上传汇总产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-industry-rotation-summary
          path: output/
          retention-days: 30
          if-no-files-found: warn
