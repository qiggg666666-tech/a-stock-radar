  yearline-v7-checkpoint-a:
    runs-on: ubuntu-latest
    # v7 会每25只保存checkpoint；340分钟上限由Actions兜底，中断后同日同分片可恢复。
    timeout-minutes: 340
    concurrency:
      group: yearline-v7-checkpoint-a-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'yearline-v7-checkpoint-a' || inputs.target == 'yearline-v7-checkpoint')) ||
      (github.event_name == 'schedule' && github.event.schedule == '30 8 * * 1-5')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Define Beijing run date
        id: run-scope
        shell: bash
        run: |
          RUN_DATE='${{ inputs.yearline_v7_as_of }}'
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Shanghai date +%F)"; fi
          if ! date -d "$RUN_DATE" +%F >/dev/null 2>&1; then
            echo "yearline_v7_as_of 必须为 YYYY-MM-DD" >&2
            exit 2
          fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
      - name: Restore checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: output/yearline_v7/checkpoints
          key: yearline-v7-checkpoint-${{ github.ref_name }}-${{ steps.run-scope.outputs.run_date }}-a-
          restore-keys: |
            yearline-v7-checkpoint-${{ github.ref_name }}-${{ steps.run-scope.outputs.run_date }}-a-
      - name: Run Year-Line v7 checkpoint shard A (0-1499)
        env:
          RUN_DATE: ${{ steps.run-scope.outputs.run_date }}
          RESET_CHECKPOINT: ${{ inputs.yearline_v7_reset }}
        shell: bash
        run: |
          mkdir -p output/yearline_v7/checkpoints
          RESET_FLAG=""
          if [ "$RESET_CHECKPOINT" = "true" ]; then RESET_FLAG="--reset-checkpoint"; fi
          python yearline_limitup_v7_checkpoint.py \
            --all --as-of "$RUN_DATE" --processes 2 \
            --scan-offset 0 --scan-limit 1500 --shard-id a \
            --checkpoint-every 25 --output-dir output/yearline_v7 $RESET_FLAG
      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/yearline_v7/checkpoints
          # cache不可变；每个run写入新key，下一次通过restore-keys取同日最新快照。
          key: yearline-v7-checkpoint-${{ github.ref_name }}-${{ steps.run-scope.outputs.run_date }}-a-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload results and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yearline-v7-checkpoint-a-${{ steps.run-scope.outputs.run_date }}
          path: output/yearline_v7/
          retention-days: 30
          if-no-files-found: warn


