name: A-Stock Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '50 3 * * *'    # 午盘（北京11:50）：涨停候选池+VAGAS+回踩筑底 实时
    - cron: '0 4 * * *'     # 午盘（北京12:00）：综合走势判断+形态共振 实时
    - cron: '45 11 * * *'   # 收盘（北京19:45）：涨停候选池+VAGAS+回踩筑底 实时
    - cron: '55 11 * * *'   # 收盘（北京19:55）：综合走势判断+形态共振 实时
    - cron: '30 7 * * *'    # 市场异常行为监控（北京15:30）
    - cron: '40 7 * * *'    # 多周期粘合蓄势（北京15:40）
    - cron: '50 7 * * *'    # W%R+OBV超卖反转（北京15:50）
    - cron: '0 8 * * *'     # 资金异动监控（北京16:00）
    - cron: '0 8 * * 5'     # 外资持股监控（周五16:00）
    - cron: '10 8 * * *'    # 板块轮动预警（北京16:10）
    - cron: '15 8 * * *'    # MACD金叉+站上年线/季线（北京16:15）
    - cron: '20 8 * * *'    # 指数MACD背离（北京16:20）
    - cron: '25 8 * * *'    # 指数支撑+量比择时（北京16:25）
    - cron: '30 8 * * *'    # 主策略+指数支撑阻力（北京16:30, 两job同cron）
    - cron: '35 8 * * *'    # 收盘后超跌首板（北京16:35）
    - cron: '40 8 * * *'    # 强势股延续（北京16:40）
    - cron: '45 8 * * *'    # COX全板块选股（北京16:45）
    - cron: '50 8 * * *'    # 板块优选+信号流水线（北京16:50）
    - cron: '55 8 * * *'    # MTF共振选股（北京16:55）
    - cron: '00 9 * * *'    # PE/PB估值筛选（北京17:00）
    - cron: '5 9 * * *'     # 多周期MACD+RSI+背离共振（北京17:05）
    - cron: '10 9 * * *'    # 520天首红信号（北京17:10）
    - cron: '15 9 * * *'    # 520首红×多周期共振（北京17:15）
    - cron: '20 9 * * *'    # 每日大盘信号(校准链)（北京17:20）
    - cron: '25 9 * * *'    # 520首红×板块（北京17:25）
    - cron: '30 9 * * *'    # MA5横盘筛选（北京17:30）
    - cron: '35 9 * * *'    # 上升趋势回调低点买入（北京17:35）
    - cron: '40 9 * * *'    # 520日线低位综合筛选（北京17:40）
    - cron: '50 9 * * *'    # 板块动量+估值分位（北京17:50）
    - cron: '0 10 * * *'    # 周线老鸭头+日线W底（北京18:00）
    - cron: '5 10 * * *'    # 底部坑底/蓄势（北京18:05）
    - cron: '10 10 * * *'   # 120日首红W底三共振（北京18:10）
    - cron: '15 10 * * *'   # 杜邦ROE多因子（北京18:15）
    - cron: '20 10 * * *'   # VCP波动收缩（北京18:20）
    - cron: '25 10 * * *'   # 多指标共振翻多（北京18:25）
    - cron: '30 10 * * *'   # MACD零轴上+ZigZag底背离（北京18:30）
    - cron: '35 10 * * *'   # KDJ超卖+MACD零轴上（北京18:35）
    - cron: '40 10 * * *'   # 布林带+W底突破（北京18:40）
    - cron: '45 10 * * *'   # Camarilla枢轴（北京18:45）
    - cron: '50 10 * * *'   # MA+RSI+ADX+BB+SMC（北京18:50）
    - cron: '55 10 * * *'   # 多周期双共振·日+周（北京18:55）
    - cron: '0 11 * * *'    # 多重底背离加权评分（北京19:00）
    - cron: '5 11 * * *'    # Vegas通道趋势突破（北京19:05）
    - cron: '10 11 * * *'   # 多周期双共振·月+季（北京19:10）
    - cron: '15 11 * * *'   # 板块资金流+PCR情绪（北京19:15）
    - cron: '20 11 * * *'   # 多周期双共振·季+年（北京19:20）
    - cron: '30 11 * * *'   # 大涨前多指标共振·全市场（北京19:30）
    - cron: '0 12 * * *'    # 矩阵日报汇总（北京20:00, 最后）
    - cron: '0 3 1 * *'     # 每月1号重算校准表

jobs:
  main-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Main Screener
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python main.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-screener-results
          path: output/
          retention-days: 30
          if-no-files-found: warn

