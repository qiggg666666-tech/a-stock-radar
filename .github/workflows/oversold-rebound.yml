# 超跌反弹选股 —— 全市场分片扫描 + 合并推送
# 放到仓库: .github/workflows/oversold-rebound.yml
#
# 依赖仓库根目录:
#   - oversold_rebound_selector.py
#   - final_chip_research.py（获利过滤）
# Secrets:
#   - SENDKEY（Server酱）

name: Oversold Rebound Selector

on:
  schedule:
    # 北京时间约 23:00（UTC 15:00），交易日可按需改
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      top_n:
        description: "合并后推送只数"
        required: false
        default: "20"
      notify:
        description: "是否 Server酱 推送 (true/false)"
        required: false
        default: "true"

jobs:
  scan:
    name: Scan shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas numpy requests baostock pyarrow

      - name: Run shard ${{ matrix.shard }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python oversold_rebound_selector.py --shard ${{ matrix.shard }}

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osr-shard-${{ matrix.shard }}
          path: oversold_rebound_cache/osr_shard_*.csv
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Merge + Notify
    needs: scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas numpy requests baostock pyarrow

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: osr-shard-*
          path: artifacts_dl
          merge-multiple: true

      - name: Collect shard CSVs
        run: |
          mkdir -p oversold_rebound_cache
          echo "=== downloaded tree ==="
          find artifacts_dl -type f -name "*.csv" 2>/dev/null | head -50 || true
          find artifacts_dl -type f -name "osr_shard_*.csv" -exec cp -f {} oversold_rebound_cache/ \; 2>/dev/null || true
          echo "=== cache ==="
          ls -la oversold_rebound_cache/ || true
          n=$(ls oversold_rebound_cache/osr_shard_*.csv 2>/dev/null | wc -l)
          echo "shard csv count: $n"
          if [ "$n" -eq 0 ]; then
            echo "WARNING: no shard csv found"
          fi

      - name: Merge and select
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          TOP="${{ github.event.inputs.top_n }}"
          TOP="${TOP:-20}"
          NOTIFY="${{ github.event.inputs.notify }}"
          NOTIFY="${NOTIFY:-true}"
          EXTRA=""
          if [ "$NOTIFY" = "true" ] || [ "$NOTIFY" = "True" ]; then
            EXTRA="--notify"
          fi
          python oversold_rebound_selector.py --merge --top "$TOP" $EXTRA

      - name: Upload result CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oversold-rebound-result
          path: |
            oversold_rebound_*.csv
            oversold_rebound_cache/
          if-no-files-found: warn
          retention-days: 14
