          - yearline-v7-checkpoint
          - yearline-v7-checkpoint-a
          - yearline-v7-checkpoint-b
          - yearline-v7-checkpoint-c
          - yearline-v7-checkpoint-d
          - double-bottom-screener-a
          - double-bottom-screener-b
          - double-bottom-screener-c
          - double-bottom-screener-d
          - alpha-signal-v7
          - alpha-signal-v7-part2
          - cox-sector-bot
          - build-calibration
          - bottom-accumulation-fast
          - bottom-accumulation-fast-a
          - bottom-accumulation-fast-b
          - bottom-accumulation-fast-c
          - bottom-accumulation-fast-d
          - bottom-accumulation-aggressive
          - bottom-accumulation-robust
          - bottom-accumulation-chan
          - duck-head-wbottom-screener
          - pattern-breakout-fast
          - pattern-breakout-fast-a
          - pattern-breakout-fast-b
          - pattern-breakout-fast-c
          - pattern-breakout-fast-d
          - bottom-limitup-trend
          - smallcap-trend-scan
          - smallcap-trend-scan-a
          - smallcap-trend-scan-b
          - smallcap-trend-scan-c
          - smallcap-trend-scan-d
          - smallcap-trend-backtest
          - daily-summary
          - market-anomaly-monitor
          - wr-obv-screen
          - backtest
