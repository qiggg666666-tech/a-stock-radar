name: 定海神针多周期扫描

on:
  # 工作日每天 16:35 (UTC+8) 运行，即收盘后 35 分钟
  schedule:
    - cron: '35 8 * * 1-5'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      periods:
        description: '扫描周期 (空格分隔，如: daily weekly)'
        required: false
        default: 'daily'
      no_push:
        description: '跳过 Server酱推送'
        required: false
        default: 'false'

env:
  PYTHONUNBUFFERED: "1"
  GH_REPO_NAME: ${{ github.repository }}
  GH_RUN_ID: ${{ github.run_id }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # 保留历史信号文件
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 定海神针扫描
        env:
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PERIODS="${{ github.event.inputs.periods }}"
            NO_PUSH="${{ github.event.inputs.no_push }}"
            if [ "$NO_PUSH" = "true" ]; then
              python scripts/dinghai_shenzhen_scanner.py --periods $PERIODS --no-push
            else
              python scripts/dinghai_shenzhen_scanner.py --periods $PERIODS
            fi
          else
            # 定时任务默认只跑日线（最快最稳），如需多周期改为: --periods daily weekly monthly
            python scripts/dinghai_shenzhen_scanner.py --periods daily
          fi

      - name: Commit and push signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals/dinghai/ cache/
          git diff --cached --quiet || (
            git commit -m "📡 定海神针信号 $(date +%Y%m%d)" &&
            git push
          )
