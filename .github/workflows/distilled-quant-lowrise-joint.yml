name: DistilledQuant LowRise Joint Research

on:
  schedule:
    # GitHub Actions五段cron；UTC 08:45 = 工作日北京时间16:45。
    - cron: "45 8 * * 1-5"
  workflow_dispatch:
    inputs:
      signal_date:
        description: "固定信号日（YYYY-MM-DD；留空使用北京时间当前工作日）"
        required: false
        default: ""
      max_rise_pct:
        description: "520日低位距离上限（仅观察层）"
        required: false
        default: "5.0"

permissions:
  contents: read

concurrency:
  group: distilled-quant-lowrise-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-universe:
    name: 准备DistilledQuant协同共同股票池
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signal_date: ${{ steps.signal-date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare baostock pandas numpy
      - name: 确定信号日
        id: signal-date
        env:
          INPUT_SIGNAL_DATE: ${{ inputs.signal_date || '' }}
        run: |
          SIGNAL_DATE="${INPUT_SIGNAL_DATE}"
          if [ -z "$SIGNAL_DATE" ]; then
            TODAY="$(TZ=Asia/Shanghai date +%F)"
            WEEKDAY="$(TZ=Asia/Shanghai date +%u)"
            if [ "$WEEKDAY" -eq 6 ]; then SIGNAL_DATE="$(TZ=Asia/Shanghai date -d "$TODAY -1 day" +%F)";
            elif [ "$WEEKDAY" -eq 7 ]; then SIGNAL_DATE="$(TZ=Asia/Shanghai date -d "$TODAY -2 day" +%F)";
            else SIGNAL_DATE="$TODAY"; fi
          fi
          echo "value=$SIGNAL_DATE" >> "$GITHUB_OUTPUT"
      - name: 生成共同股票池
        run: |
          python -m py_compile quant_distilled_core_research.py quant_distilled_lowrise_universe.py quant_distilled_lowrise_shard.py quant_distilled_lowrise_summary.py
          python quant_distilled_lowrise_universe.py --self-test
          python quant_distilled_lowrise_shard.py --self-test
          python quant_distilled_lowrise_universe.py --signal-date "${{ steps.signal-date.outputs.value }}" --output output/joint_universe.json --timeout-seconds 45 --retries 2
      - name: 上传共同股票池审计
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-quant-lowrise-universe
          path: output/joint_universe.json
          retention-days: 30
          if-no-files-found: warn

  scan:
    name: DistilledQuant协同扫描 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: A
            shard_index: 0
          - shard: B
            shard_index: 1
          - shard: C
            shard_index: 2
          - shard: D
            shard_index: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare baostock pandas numpy
      - name: 下载共同股票池
        uses: actions/download-artifact@v4
        with:
          name: distilled-quant-lowrise-universe
          path: input
      - name: 扫描本分片
        run: |
          python quant_distilled_lowrise_shard.py \
            --universe-file input/joint_universe.json \
            --signal-date "${{ needs.prepare-universe.outputs.signal_date }}" \
            --shard-index "${{ matrix.shard_index }}" --shard-count 4 \
            --max-rise-pct "${{ inputs.max_rise_pct || '5.0' }}" \
            --output-dir "output/shard-${{ matrix.shard_index }}"
      - name: 上传本分片结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-quant-lowrise-shard-${{ matrix.shard_index }}
          path: output/shard-${{ matrix.shard_index }}
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: DistilledQuant协同全市场汇总
    runs-on: ubuntu-latest
    needs: [prepare-universe, scan]
    if: ${{ always() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy
      - name: 下载可用分片artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: distilled-quant-lowrise-shard-*
          path: collected
          merge-multiple: false
      - name: 生成统一汇总（缺片仍保留partial审计）
        run: |
          python quant_distilled_lowrise_summary.py --input-root collected --shard-count 4 --output-dir output/summary
      - name: 上传统一汇总artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-quant-lowrise-summary
          path: output/summary
          retention-days: 30
          if-no-files-found: warn
