# 原版520首红宽松观察版：每日只输出信号日等于最后可用日线的当日结果。
name: First Red 520 Original Daily

on:
  schedule:
    # UTC 08:30 = 北京时间工作日16:30；仅收盘后确认日线。
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-red-520-original-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-universe:
    name: 准备一次共享A股股票池
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 恢复三日共享股票池缓存
        uses: actions/cache/restore@v4
        with:
          path: .a_share_universe_cache
          key: a-share-universe-${{ runner.os }}-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            a-share-universe-${{ runner.os }}-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 获取并校验共享股票池
        run: |
          python prepare_a_share_universe.py \
            --output output/a_share_universe.json \
            --status-output output/a_share_universe_status.json \
            --cache-file .a_share_universe_cache/a_share_universe.json \
            --cache-max-age-days 3 --ak-timeout 45 --bao-timeout 35 --retries 2 --retry-wait-seconds 4
      - name: 保存三日共享股票池缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .a_share_universe_cache
          key: a-share-universe-${{ runner.os }}-${{ github.workflow }}-${{ github.run_id }}
      - name: 上传共享股票池
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-original-universe
          path: |
            output/a_share_universe.json
            output/a_share_universe_status.json
          retention-days: 30
          if-no-files-found: warn

  first-red-original-scan:
    name: 原版520首红观察 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    if: needs.prepare-universe.result == 'success'
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { shard: a, offset: 0, limit: 1000 }
          - { shard: b, offset: 1000, limit: 1000 }
          - { shard: c, offset: 2000, limit: 1000 }
          - { shard: d, offset: 3000, limit: 1000 }
          - { shard: e, offset: 4000, limit: 0 }
    steps:
      - uses: actions/checkout@v4
      - name: 下载共享股票池
        uses: actions/download-artifact@v4
        with:
          name: first-red-original-universe
          path: input
      - name: 检查共享股票池
        run: test -s input/a_share_universe.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 原版脚本自检
        run: |
          python -m py_compile first_red_520.py
          python first_red_520.py --self-test
      - name: 扫描当日原版首红分片
        run: |
          python first_red_520.py \
            --output-dir output --universe-json input/a_share_universe.json \
            --shard "${{ matrix.shard }}" --offset "${{ matrix.offset }}" --limit "${{ matrix.limit }}" \
            --processes 2 --query-timeout 12 --checkpoint-every 25 --max-runtime-seconds 19200 \
            --live-only --no-resume --no-push
      - name: 上传原版首红分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-original-${{ matrix.shard }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  first-red-original-summary:
    name: 原版520首红质量闸门与单条通知
    runs-on: ubuntu-latest
    needs: [prepare-universe, first-red-original-scan]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 下载原版首红五分片artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: first-red-original-?
          path: collected
          merge-multiple: false
      - name: 下载共享股票池状态artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: first-red-original-universe
          path: collected/universe
      - name: 生成全市场当日名单并发送单条通知
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python first_red_520_daily_summary.py --input-root collected --output-dir output --notify true
      - name: 上传原版最终产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-original-summary
          path: output/
          retention-days: 30
          if-no-files-found: warn
