name: Dinghai Multi-Period Research

on:
  schedule:
    - cron: "15 11 * * 1-5" # 北京时间工作日19:15
  workflow_dispatch:
    inputs:
      signal_date:
        description: "信号日（YYYY-MM-DD；留空则取北京时间当天）"
        required: false
        default: ""
      top_n:
        description: "最多输出多少条研究观察记录"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: "dinghai-multiperiod-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signal_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pandas numpy akshare baostock
      - run: |
          python -m py_compile dinghai_multiperiod_research.py dinghai_universe.py dinghai_shard.py dinghai_summary.py
          python dinghai_multiperiod_research.py --self-test
          python dinghai_universe.py --self-test
          python dinghai_shard.py --self-test
      - id: date
        run: echo "value=${{ inputs.signal_date || '' }}" | grep -q '[0-9]' && echo "value=${{ inputs.signal_date }}" >> "$GITHUB_OUTPUT" || echo "value=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - run: python dinghai_universe.py --signal-date "${{ steps.date.outputs.value }}" --output output/dinghai_universe.json --status-output output/dinghai_universe_status.json --timeout-seconds 120 --retries 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dinghai-universe
          path: |
            output/dinghai_universe.json
            output/dinghai_universe_status.json
          retention-days: 7
          if-no-files-found: warn

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pandas numpy akshare baostock
      - uses: actions/download-artifact@v4
        with:
          name: dinghai-universe
          path: input
      - run: python dinghai_shard.py --universe-file input/dinghai_universe.json --signal-date "${{ needs.prepare.outputs.signal_date }}" --shard-index "${{ matrix.shard_index }}" --shard-count 4 --start-date 2024-01-01 --timeout-seconds 35 --retries 1 --pause-seconds 0.25 --output-dir "output/shard-${{ matrix.shard_index }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dinghai-shard-${{ matrix.shard_index }}
          path: output/shard-${{ matrix.shard_index }}
          retention-days: 7

  summary:
    needs: [prepare, scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pandas numpy
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dinghai-shard-*
          path: collected
          merge-multiple: false
      - run: python dinghai_summary.py --input-root collected --top-n "${{ inputs.top_n || '80' }}" --notify --output-dir output/summary
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dinghai-summary
          path: output/summary
          retention-days: 14
