name: Strong Stock Screener

# 盘中强势股快照筛选（创业板 + 涨幅 + 量比 + 成交额），结果推送 Server酱并保存 CSV。
# 先只保留手动触发（workflow_dispatch）验证：重点看东方财富接口在 Actions 里能不能稳定取到数据；
# 如果日志里出现“切换新浪备用源”，说明东方财富被限流，此时没有量比，结果和带量比的不同。
# 验证稳定后再考虑加定时，例如交易日北京时间 10:30 和 14:00（cron 用 UTC，北京时间减 8 小时）：
#   schedule:
#     - cron: "30 2 * * 1-5"    # 北京 10:30
#     - cron: "0 6 * * 1-5"     # 北京 14:00
# 注意：GitHub 的定时任务可能延迟几分钟到十几分钟；节假日也会触发（脚本不判断节假日，会给出“非交易时段”提示）。

on:
  workflow_dispatch:
    inputs:
      min_pct:
        description: "最低涨幅（百分数，10 即 10%）"
        type: string
        default: "10"
      min_volume_ratio:
        description: "最低量比（仅东方财富源有量比）"
        type: string
        default: "2.5"
      min_amount_yi:
        description: "最低成交额（亿元，0.5 即 5000 万）"
        type: string
        default: "0.5"
      boards:
        description: "板块：cyb=创业板 / cyb_kcb=创业板+科创板 / all=全部"
        type: choice
        options: ["cyb", "cyb_kcb", "all"]
        default: "cyb"
      top:
        description: "最多输出多少只"
        type: string
        default: "30"
      notify:
        description: "是否推送 Server酱"
        type: choice
        options: ["true", "false"]
        default: "true"
      notify_empty:
        description: "没有命中时是否也推送一条“0只”"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check akshare pandas requests

      - name: Screen strong stocks
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          MIN_PCT: ${{ inputs.min_pct || '10' }}
          MIN_VR: ${{ inputs.min_volume_ratio || '2.5' }}
          MIN_AMOUNT_YI: ${{ inputs.min_amount_yi || '0.5' }}
          BOARDS: ${{ inputs.boards || 'cyb' }}
          TOP_N: ${{ inputs.top || '30' }}
          NOTIFY: ${{ inputs.notify || 'true' }}
          NOTIFY_EMPTY: ${{ inputs.notify_empty || 'true' }}
        run: |
          EXTRA=""
          if [ "$NOTIFY" = "true" ]; then EXTRA="$EXTRA --notify"; fi
          if [ "$NOTIFY_EMPTY" = "false" ]; then EXTRA="$EXTRA --no-notify-empty"; fi
          python strong_stock_screener.py \
            --min-pct "$MIN_PCT" \
            --min-volume-ratio "$MIN_VR" \
            --min-amount-yi "$MIN_AMOUNT_YI" \
            --boards "$BOARDS" \
            --top "$TOP_N" \
            --out-dir out \
            $EXTRA

      - name: Upload result CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-stocks
          path: out/strong_stocks_*.csv
          if-no-files-found: ignore
          retention-days: 30
