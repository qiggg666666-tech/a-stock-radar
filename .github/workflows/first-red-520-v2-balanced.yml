# 520首红V2均衡版：独立生产Workflow；不进入主Workflow的all。
name: First Red 520 V2 Balanced

on:
  schedule:
    # UTC 08:30 = 北京时间工作日16:30；仅收盘确认版自动运行。
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-red-520-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-universe:
    name: 准备一次共享A股股票池
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 获取并校验共享股票池
        run: |
          python prepare_a_share_universe.py \
            --output output/a_share_universe.json \
            --status-output output/a_share_universe_status.json \
            --cache-file .a_share_universe_cache/a_share_universe.json \
            --cache-max-age-days 3 --ak-timeout 45 --bao-timeout 35 --retries 2 --retry-wait-seconds 4
      - name: 上传共享股票池
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-v2-universe
          path: |
            output/a_share_universe.json
            output/a_share_universe_status.json
          retention-days: 30
          if-no-files-found: warn

  first-red-v2-scan:
    name: 首红V2均衡版 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    if: needs.prepare-universe.result == 'success'
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { shard: a, offset: 0, limit: 1000 }
          - { shard: b, offset: 1000, limit: 1000 }
          - { shard: c, offset: 2000, limit: 1000 }
          - { shard: d, offset: 3000, limit: 1000 }
          # limit=0：扫描offset后全部剩余股票，避免固定池长遗漏尾部标的。
          - { shard: e, offset: 4000, limit: 0 }
    steps:
      - uses: actions/checkout@v4
      - name: 下载共享股票池
        uses: actions/download-artifact@v4
        with:
          name: first-red-v2-universe
          path: input
      - name: 检查共享股票池
        run: test -s input/a_share_universe.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: V2脚本自检
        run: |
          python -m py_compile first_red_520_v2_balanced.py
          python first_red_520_v2_balanced.py --self-test
      - name: 扫描当前V2分片
        env:
          OUTPUT_DIR: output
          SHARD: ${{ matrix.shard }}
          OFFSET: ${{ matrix.offset }}
          LIMIT: ${{ matrix.limit }}
          NUM_PROCESSES: '2'
          QUERY_TIMEOUT_SEC: '12'
          MAX_RUNTIME_SECONDS: '19200'
        run: |
          python first_red_520_v2_balanced.py \
            --mode scan --output-dir output --universe-json input/a_share_universe.json \
            --shard "${{ matrix.shard }}" --offset "${{ matrix.offset }}" --limit "${{ matrix.limit }}" \
            --processes 2 --query-timeout 12 --max-runtime-seconds 19200 --no-resume
      - name: 上传V2分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-v2-${{ matrix.shard }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  first-red-v2-summary:
    name: 首红V2全市场质量闸门与单条通知
    runs-on: ubuntu-latest
    needs: [prepare-universe, first-red-v2-scan]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 下载V2五分片artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: first-red-v2-?
          path: collected
          merge-multiple: false
      - name: 生成全市场最终名单并发送单条通知
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          python first_red_520_v2_balanced.py \
            --mode consolidate --input-root collected --output-dir output --notify true
      - name: 上传V2最终产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-v2-summary
          path: output/
          retention-days: 30
          if-no-files-found: warn
