name: A-Stock Radar

on:
  # 手动运行时仅执行所选任务，避免一次性启动全部 job。
  workflow_dispatch:
    inputs:
      target:
        description: "选择要手动执行的任务；选择 all 会启动全部任务（高资源）"
        required: true
        type: choice
        options:
          - all
          - main-screener
          - strong-continuation
          - sector-pipeline
          - first-red-520-screener
          - daily-market-signal
          - ma5-sideways-screener
          - ma520-bottom-screener
          - sector-momentum-valuation
          - market-fund-alert
          - foreign-holder-monitor
          - sector-rotation-alert
          - index-divergence-alert
          - index-support-resistance
          - index-support-signal
          - quant-signal-bot
          - zt-pre-screener
          - macd-resonance-screener
          - first-red-macd-combo
          - first-red-sector-combo
          - dip-buy-screener
          - dupont-roe-screener
          - vcp-screener
          - bull-confirm-screener
          - macd-zigzag-divergence
          - camarilla-screener
          - ma-rsi-adx-screener
          - mtf-full-dw
          - divergence-screener
          - vegas-tunnel-screener
          - trend-judge-screener
          - sector-flow-pcr-screener
          - multi-period-macd-screener
          - resonance-signal-screener
          - yearline-limitup-screener-a
          - yearline-limitup-screener-b
          - double-bottom-screener-a
          - double-bottom-screener-b
          - alpha-signal-v7
          - alpha-signal-v7-part2
          - cox-sector-bot
          - build-calibration
          - bottom-accumulation-screener
          - duck-head-wbottom-screener
          - pattern-breakout-screener
          - bottom-limitup-trend
          - daily-summary
          - market-anomaly-monitor
          - macd-ma-crossover-screener
          - wr-obv-screen
          - backtest
      confirm_write:
        description: "仅 build-calibration 需要：确认允许写入 calibration_table.csv"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '40 3 * * *'    # 11:40 resonance-signal
    - cron: '50 3 * * *'    # 11:50 zt-pre
    - cron: '0 4 * * *'     # 12:00 trend-judge
    - cron: '10 4 * * *'    # 12:10 午盘收盘后 bottom-limitup-trend
    - cron: '30 7 * * *'    # 15:30 market-anomaly
    - cron: '50 7 * * *'    # 15:50 wr-obv
    - cron: '0 8 * * *'     # 16:00 market-fund
    - cron: '0 8 * * 5'     # 周五16:00 foreign-holder
    - cron: '10 8 * * *'    # 16:10 sector-rotation
    - cron: '15 8 * * *'    # 16:15 macd-ma-crossover, pattern-breakout
    - cron: '20 8 * * *'    # 16:20 index-divergence
    - cron: '25 8 * * *'    # 16:25 index-support-signal
    - cron: '30 8 * * *'    # 16:30 main, index-support-resistance, bottom-limitup-trend(收盘后)
    - cron: '35 8 * * *'    # 16:35 quant-signal
    - cron: '40 8 * * *'    # 16:40 strong-continuation
    - cron: '45 8 * * *'    # 16:45 cox-sector
    - cron: '50 8 * * *'    # 16:50 sector-pipeline
    - cron: '5 9 * * *'     # 17:05 macd-resonance
    - cron: '10 9 * * *'    # 17:10 first-red-520
    - cron: '15 9 * * *'    # 17:15 first-red-macd
    - cron: '20 9 * * *'    # 17:20 daily-market
    - cron: '25 9 * * *'    # 17:25 first-red-sector
    - cron: '30 9 * * *'    # 17:30 ma5-sideways
    - cron: '35 9 * * *'    # 17:35 dip-buy
    - cron: '40 9 * * *'    # 17:40 ma520-bottom
    - cron: '50 9 * * *'    # 17:50 sector-momentum-valuation
    - cron: '0 10 * * *'    # 18:00 duck-head-wbottom
    - cron: '5 10 * * *'    # 18:05 bottom-accumulation
    - cron: '15 10 * * *'   # 18:15 dupont-roe
    - cron: '20 10 * * *'   # 18:20 vcp
    - cron: '25 10 * * *'   # 18:25 bull-confirm
    - cron: '30 10 * * *'   # 18:30 macd-zigzag
    - cron: '45 10 * * *'   # 18:45 camarilla
    - cron: '50 10 * * *'   # 18:50 ma-rsi-adx
    - cron: '55 10 * * *'   # 18:55 mtf-full-dw
    - cron: '0 11 * * *'    # 19:00 divergence
    - cron: '5 11 * * *'    # 19:05 vegas-tunnel
    - cron: '15 11 * * *'   # 19:15 sector-flow-pcr
    - cron: '25 11 * * *'   # 19:25 multi-period-macd
    - cron: '30 11 * * *'   # 19:30 resonance-signal (收盘后)
    - cron: '35 11 * * *'   # 19:35 double-bottom (A/B 并发)
    - cron: '40 11 * * *'   # 19:40 yearline-limitup (A/B 并发)
    - cron: '45 11 * * *'   # 19:45 zt-pre (收盘后)
    - cron: '50 11 * * *'   # 19:50 alpha-signal-v7 (Part1)
    - cron: '55 11 * * *'   # 19:55 trend-judge (收盘后)
    - cron: '30 12 * * *'   # 20:30 daily-summary（等待当日筛选任务完成后生成最终汇总）
    - cron: '5 12 * * *'    # 20:05 alpha-signal-v7-part2
    - cron: '0 3 1 * *'     # 每月1号 11:00 build-calibration

# 默认令牌仅具备读取代码的权限；需要额外权限的 job 在其自身配置中明确声明。
permissions:
  contents: read

# 相同定时任务或同一手动目标重复触发时排队，避免重复通知和重复计算。
concurrency:
  group: a-stock-radar-${{ github.event.schedule || inputs.target || github.run_id }}
  cancel-in-progress: false

jobs:
  main-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'main-screener' || inputs.target == 'all')) ||
      (github.event_name == 'schedule' && (github.event.schedule == '30 8 * * *'))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Main Screener
        env: { SENDKEY: '${{ secrets.SENDKEY }}' }
        run: python main.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: main-screener-results, path: output/, retention-days: 30, if-no-files-found: warn }

  strong-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'strong-continuation' || inputs.target == 'all')) ||
