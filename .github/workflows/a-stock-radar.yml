      - name: Run Build Calibration
        run: python build_calibration.py
      - name: Commit calibration_table.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calibration_table.csv
          if git diff --staged --quiet; then
            echo "calibration_table.csv 无变更，跳过提交。"
          else
            git commit -m "自动更新: 大盘信号校准表 $(date +'%Y-%m-%d')"
            git push
