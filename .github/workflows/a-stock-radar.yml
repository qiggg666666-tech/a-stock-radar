  daily-summary:
    runs-on: ubuntu-latest
    # 最大等待约 5 小时 20 分；保留剩余时间供汇总脚本执行，总时长不超过 GitHub-hosted job 限制。
    timeout-minutes: 360
    concurrency:
      group: a-stock-radar-daily-summary
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'daily-summary' || inputs.target == 'all')) ||
      (github.event_name == 'schedule' && (github.event.schedule == '30 12 * * *'))
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Wait for scheduled screeners to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MAX_WAIT_SECONDS: '19200'
        run: |
          set -euo pipefail
          deadline=$((SECONDS + MAX_WAIT_SECONDS))
          while true; do
            active_runs="$({
              for status in queued in_progress; do
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$GITHUB_WORKFLOW" \
                  --event schedule \
                  --status "$status" \
                  --limit 100 \
                  --json databaseId
              done
            } | jq -s --arg self "$CURRENT_RUN_ID" -r               'add | .[]? | select((.databaseId | tostring) != $self) | .databaseId' | sort -u)"

            if [[ -z "$active_runs" ]]; then
              echo "所有已调度的上游 workflow run 均已结束。"
              break
            fi

            if (( SECONDS >= deadline )); then
              echo "等待上游任务超时，停止生成可能不完整的最终汇总。" >&2
              exit 1
            fi

            echo "仍在等待 workflow run: $(tr '\n' ' ' <<< "$active_runs")"
            sleep 60
          done
      - name: Run Daily Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SERVERCHAN_KEY: ${{ secrets.SENDKEY }}
          SUMMARY_MODE: final
        run: python daily_summary.py

