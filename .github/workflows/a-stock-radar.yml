        required: false
        default: false
        type: boolean
      smallcap_signal_mode:
        description: "小市值趋势信号模式（仅smallcap任务使用）"
        required: false
        default: normal
        type: choice
        options:
          - sensitive
          - normal
          - stable
      confirm_smallcap_backtest:
