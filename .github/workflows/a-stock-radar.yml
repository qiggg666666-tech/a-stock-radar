# 小市值趋势研究已合并：扫描在工作日16:30与已有收盘任务共用同一cron，但不进入all；回测仅手动确认。
# 回测要求research_data/smallcap_backtest_codes.csv和smallcap_universe_snapshots.csv存在，防止用当前市值反推历史。
# 最终安全版：旧重型任务已下线；底部吸筹、底部涨停趋势、形态突破均采用安全修复实现。
# 形态突破为趋势背景 + 平台收缩 + 量能收缩 + 放量突破 + 位置控制的研究型筛选器。
# 本版以底部吸筹快速分片安全workflow为基线，并修复bottom-limitup-trend的全局数据源未就绪失败。
# 12:10 BJT使用intraday预警模式；16:30 BJT与手动运行使用close确认模式。
# 方案B扩展：VCP、牛市确认、年线v5.2及既有三类四分片策略均关闭子分片直推，由策略级汇总任务发送单条通知。
# 本版以 core-safe 为基线：旧 bottom-accumulation-screener 已由 bottom-accumulation-fast A/B/C/D 取代。
# 旧源文件不删除；快速版具备四分片、父进程强制终止超时、检查点、断路器和320分钟主动退出。
# 已安全下线旧重型任务：first-red-520、ma520-bottom、mtf-full-dw、divergence、multi-period-macd、macd-ma-crossover、ma-rsi-adx、trend-judge、resonance。
# 对应源文件未删除；完整旧workflow保存在 a-stock-radar-legacy-all-fast-vcp.yml，观察20个交易日后再决定物理删除。
name: A-Stock Radar

on:
