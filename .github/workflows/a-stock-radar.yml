  workflow_dispatch:
    inputs:
      target:
        description: "选择要手动执行的任务；选择 all 会启动全部任务（高资源）"
        required: true
        type: choice
        options:
          - all
          - main-screener
          - strong-continuation
          - sector-pipeline
          - daily-market-signal
          - ma5-sideways-screener
          - sector-momentum-valuation
          - market-fund-alert
          - foreign-holder-monitor
          - sector-rotation-alert
