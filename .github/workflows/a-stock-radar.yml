    - cron: '0 8 * * 5'     # 周五16:00 foreign-holder
    - cron: '10 8 * * *'    # 16:10 sector-rotation
    - cron: '10 8 * * 1-5'  # 工作日16:10：底部吸筹多周期共振（激进/稳健/缠论中枢三档并行）
    - cron: '15 8 * * *'    # 16:15 macd-ma-crossover, pattern-breakout
    - cron: '20 8 * * *'    # 16:20 index-divergence
    - cron: '25 8 * * *'    # 16:25 index-support-signal
    - cron: '30 8 * * *'    # 16:30 main, index-support-resistance, bottom-limitup-trend(收盘后)
    - cron: '30 8 * * 1-5'  # 工作日16:30：年线v7 checkpoint四分片（不进入all）
    - cron: '35 8 * * *'    # 16:35 quant-signal
    - cron: '40 8 * * *'    # 16:40 strong-continuation
    - cron: '45 8 * * *'    # 16:45 cox-sector
    - cron: '50 8 * * *'    # 16:50 sector-pipeline
    - cron: '5 9 * * *'     # 17:05 macd-resonance
    - cron: '15 9 * * *'    # 17:15 first-red-macd
    - cron: '20 9 * * *'    # 17:20 daily-market
    - cron: '25 9 * * *'    # 17:25 first-red-sector
    - cron: '30 9 * * *'    # 17:30 ma5-sideways
    - cron: '35 9 * * *'    # 17:35 dip-buy
    - cron: '50 9 * * *'    # 17:50 sector-momentum-valuation
    - cron: '0 10 * * *'    # 18:00 duck-head-wbottom
    - cron: '5 10 * * *'    # 18:05 bottom-accumulation-fast (A/B/C/D 四分片并发)
    - cron: '15 10 * * *'   # 18:15 dupont-roe
    - cron: '20 10 * * *'   # 18:20 vcp (A/B/C/D 四分片快速版并发)
