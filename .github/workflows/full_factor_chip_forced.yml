name: Full Factor + Forced Chip Filter

on:
  schedule:
    - cron: "30 14 * * *"   # 北京时间每天 22:30
  workflow_dispatch:
    inputs:
      start_date:
        description: "回测开始日期"
        type: string
        default: "2019-01-01"
      end_date:
        description: "回测结束日期"
        type: string
        default: "2024-12-31"
      run_backtest:
        description: "是否在分片结束后自动回测"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: full-factor-chip-forced-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --disable-pip-version-check akshare baostock pandas numpy scikit-learn statsmodels matplotlib pyarrow requests
      - name: Check final_chip_research
        run: |
          if [ ! -f final_chip_research.py ]; then
            echo "错误：缺少 final_chip_research.py"
            exit 1
          fi
          python -c "from final_chip_research import analyze, fetch_ohlcv; print('final_chip_research OK')"

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --disable-pip-version-check akshare baostock pandas numpy scikit-learn statsmodels matplotlib pyarrow requests
      - name: Run shard ${{ matrix.shard }}
        run: |
          python full_factor_chip_forced_full.py \
            --shard ${{ matrix.shard }} \
            --start ${{ github.event.inputs.start_date || '2019-01-01' }} \
            --end ${{ github.event.inputs.end_date || '2024-12-31' }}
      - name: Upload shard cache
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factor-chip-shard-${{ matrix.shard }}
          path: factor_chip_full_cache/
          if-no-files-found: warn
          retention-days: 7

  backtest:
    needs: [prepare, scan]
    if: ${{ always() && (github.event.inputs.run_backtest == 'true' || github.event.inputs.run_backtest == true || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --disable-pip-version-check akshare baostock pandas numpy scikit-learn statsmodels matplotlib pyarrow requests
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: factor-chip-shard-*
          path: factor_chip_full_cache
          merge-multiple: true
      - name: Check downloaded files
        run: |
          echo "当前目录内容："
          ls -la
          echo "缓存目录内容："
          ls -la factor_chip_full_cache || echo "缓存目录不存在"
          find factor_chip_full_cache -name "*.parquet" | head -20 || true
      - name: Run backtest + Server酱推送
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python full_factor_chip_forced_full.py --shard backtest
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-chip-forced-results
          path: |
            full_chip_forced_backtest.csv
            full_chip_forced_weights.csv
            full_chip_forced_equity.png
          if-no-files-found: warn
          retention-days: 14
