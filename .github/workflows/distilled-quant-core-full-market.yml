name: DistilledQuant Core Full Market Research

on:
  schedule:
    - cron: "45 8 * * 1-5"
  workflow_dispatch:
    inputs:
      signal_date:
        required: false
        default: ""
        description: "固定信号日YYYY-MM-DD"

permissions:
  contents: read

concurrency:
  group: "distilled-quant-core-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signal_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install akshare baostock pandas numpy
      - id: date
        env:
          INPUT: ${{ inputs.signal_date || '' }}
        run: |
          D="$INPUT"
          if [ -z "$D" ]; then D="$(TZ=Asia/Shanghai date +%F)"; fi
          echo "value=$D" >> "$GITHUB_OUTPUT"
      - run: |
          python -m py_compile quant_distilled_core_research.py distilled_quant_core_universe.py distilled_quant_core_shard.py distilled_quant_core_summary.py
          python distilled_quant_core_universe.py --self-test
          python distilled_quant_core_shard.py --self-test
          python distilled_quant_core_universe.py --signal-date "${{ steps.date.outputs.value }}" --output output/core_universe.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-quant-core-universe
          path: output/core_universe.json
          retention-days: 30
          if-no-files-found: warn

  scan:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install akshare baostock pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: distilled-quant-core-universe
          path: input
      - run: python distilled_quant_core_shard.py --universe-file input/core_universe.json --signal-date "${{ needs.prepare.outputs.signal_date }}" --shard-index "${{ matrix.shard_index }}" --shard-count 4 --output-dir "output/shard-${{ matrix.shard_index }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-quant-core-shard-${{ matrix.shard_index }}
          path: output
          retention-days: 30
          if-no-files-found: warn

  summary:
    runs-on: ubuntu-latest
    needs: [prepare, scan]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: distilled-quant-core-shard-*
          path: collected
      - run: python distilled_quant_core_summary.py --input-root collected --output-dir output/summary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-quant-core-summary
          path: output/summary
          retention-days: 30
          if-no-files-found: warn
