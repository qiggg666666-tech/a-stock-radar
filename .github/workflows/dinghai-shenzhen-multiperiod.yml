name: 定海神针多周期扫描

on:
  schedule:
    - cron: '35 8 * * 1-5'
  workflow_dispatch:
    inputs:
      periods:
        description: '扫描周期 (空格分隔)'
        required: false
        default: 'daily'
      no_push:
        description: '跳过推送'
        required: false
        default: 'false'

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/scan_dinghai.py --periods ${{ github.event.inputs.periods }} ${{ github.event.inputs.no_push == 'true' && '--no-push' || '' }}
          else
            python scripts/scan_dinghai.py --periods daily
          fi

      - name: Commit signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals/dinghai/ cache/
          git diff --cached --quiet || (git commit -m "📡 定海神针 $(date +%Y%m%d)" && git push)
