name: Chi Diao Zhu Li Daily Research

on:
  schedule:
    # UTC 08:30 = 北京时间工作日16:30；仅运行当日技术研究扫描。
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chi-diao-zhu-li-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-universe:
    name: 准备一次小市值共同股票池
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 获取当日共同股票池
        run: |
          python chi_diao_zhu_li_smallcap_prepare.py \
            --output output/chi_diao_smallcap_universe.csv \
            --status-output output/chi_diao_smallcap_universe_status.json \
            --min-float-cap-yi 20 --max-float-cap-yi 200 --min-amount-yi 0.20 --ak-timeout 30
      - name: 上传共同股票池
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chi-diao-zhu-li-universe
          path: output/
          retention-days: 30
          if-no-files-found: warn

  chi-diao-scan:
    name: 吃掉主力研究 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    if: needs.prepare-universe.result == 'success'
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { shard: a, offset: 0, limit: 1000 }
          - { shard: b, offset: 1000, limit: 1000 }
          - { shard: c, offset: 2000, limit: 1000 }
          # D扫描末尾全部剩余股票，避免共同股票池长度变化造成遗漏。
          - { shard: d, offset: 3000, limit: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chi-diao-zhu-li-universe
          path: input
      - name: 检查共同股票池
        run: test -s input/chi_diao_smallcap_universe.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 脚本自检
        run: |
          python -m py_compile chi_diao_zhu_li_optimized.py chi_diao_zhu_li_smallcap_scanner.py
          python chi_diao_zhu_li_optimized.py --self-test
          python chi_diao_zhu_li_smallcap_scanner.py --self-test
      - name: 扫描当前分片
        env:
          OUTPUT_DIR: output
          UNIVERSE_FILE: input/chi_diao_smallcap_universe.csv
          SCAN_SHARD: ${{ matrix.shard }}
          SCAN_OFFSET: ${{ matrix.offset }}
          SCAN_LIMIT: ${{ matrix.limit }}
          SIGNAL_MODE: normal
          MIN_FLOAT_CAP_YI: '20'
          MAX_FLOAT_CAP_YI: '200'
          MIN_AMOUNT_YI: '0.20'
          MIN_WATCH_SCORE: '70'
          NUM_WORKERS: '2'
          AK_TIMEOUT: '12'
          BAO_TIMEOUT: '8'
          PER_SYMBOL_TIMEOUT: '36'
          MAX_RUNTIME_SECONDS: '19200'
          MAX_FAILURES: '200'
          CHECKPOINT_EVERY: '25'
          RESUME: 'false'
          ENABLE_NOTIFY: 'false'
        run: python chi_diao_zhu_li_smallcap_scanner.py
      - name: 上传分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chi-diao-zhu-li-${{ matrix.shard }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  chi-diao-summary:
    name: 吃掉主力研究质量闸门与单条通知
    runs-on: ubuntu-latest
    needs: [prepare-universe, chi-diao-scan]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: input
          pattern: chi-diao-zhu-li-*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 汇总并仅推送一条通知
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          python chi_diao_zhu_li_daily_summary.py \
            --input-dir input \
            --universe-status input/chi_diao_smallcap_universe_status.json \
            --output-dir output \
            --sendkey "$SENDKEY" \
            --max-source-error-rate 5
      - name: 上传最终汇总artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chi-diao-zhu-li-summary
          path: output/
          retention-days: 30
          if-no-files-found: warn
