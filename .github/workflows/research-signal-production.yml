# 手机端直接生产运行：请创建为 .github/workflows/research-signal-production.yml。
# 不加入主Workflow的all；仅手动触发，使用A-E五分片和单条汇总通知。
name: Research Signal Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-signal-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-universe:
    name: 准备一次共享A股股票池
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 获取并校验共享股票池
        run: |
          python prepare_a_share_universe.py \
            --output output/a_share_universe.json \
            --status-output output/a_share_universe_status.json \
            --cache-file .a_share_universe_cache/a_share_universe.json \
            --cache-max-age-days 3 --ak-timeout 45 --bao-timeout 35 --retries 2 --retry-wait-seconds 4
      - name: 上传共享股票池
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-signal-production-universe
          path: |
            output/a_share_universe.json
            output/a_share_universe_status.json
          retention-days: 30
          if-no-files-found: warn

  first-red-520-production:
    name: 520首红全市场 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { shard: a, offset: 0, limit: 800 }
          - { shard: b, offset: 800, limit: 800 }
          - { shard: c, offset: 1600, limit: 800 }
          - { shard: d, offset: 2400, limit: 800 }
          - { shard: e, offset: 3200, limit: 1200 }
    if: needs.prepare-universe.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: 下载共享股票池
        uses: actions/download-artifact@v4
        with:
          name: research-signal-production-universe
          path: input
      - name: 检查共享股票池
        run: test -s input/a_share_universe.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 脚本自检
        run: |
          python -m py_compile first_red_520.py
          python first_red_520.py --self-test
      - name: 扫描当前首红分片
        env:
          OUTPUT_DIR: output
          SHARD: ${{ matrix.shard }}
          OFFSET: ${{ matrix.offset }}
          LIMIT: ${{ matrix.limit }}
          NUM_PROCESSES: '2'
          QUERY_TIMEOUT_SEC: '12'
          CHECKPOINT_EVERY: '25'
          MAX_RUNTIME_SECONDS: '19200'
        run: |
          python first_red_520.py \
            --output-dir output --universe-json input/a_share_universe.json \
            --shard "${{ matrix.shard }}" --offset "${{ matrix.offset }}" --limit "${{ matrix.limit }}" \
            --processes 2 --query-timeout 12 --checkpoint-every 25 --max-runtime-seconds 19200 --no-push
      - name: 上传首红分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-red-520-production-${{ matrix.shard }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  capital-flow-production:
    name: 资本流全市场 · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: prepare-universe
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { shard: a, index: 0 }
          - { shard: b, index: 1 }
          - { shard: c, index: 2 }
          - { shard: d, index: 3 }
          - { shard: e, index: 4 }
    if: needs.prepare-universe.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: 下载共享股票池
        uses: actions/download-artifact@v4
        with:
          name: research-signal-production-universe
          path: input
      - name: 检查共享股票池
        run: test -s input/a_share_universe.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 脚本自检
        run: |
          python -m py_compile capital_flow_research_screener.py
          python capital_flow_research_screener.py --self-test
      - name: 扫描当前资本流分片
        run: |
          python capital_flow_research_screener.py \
            --universe-json input/a_share_universe.json --allow-universe-without-mv \
            --preselect-top 1000 --shard-index "${{ matrix.index }}" --shard-count 5 \
            --top 30 --checkpoint-every 25 --ak-timeout 12 --bao-timeout 10 \
            --max-runtime-seconds 19200 --output-dir output
      - name: 上传资本流分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-flow-production-${{ matrix.shard }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  research-signal-production-summary:
    name: 全市场研究信号单条汇总
    runs-on: ubuntu-latest
    needs: [prepare-universe, first-red-520-production, capital-flow-production]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 下载首红五分片artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: first-red-520-production-*
          path: collected/first-red-520
          merge-multiple: false
      - name: 下载资本流五分片artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: capital-flow-production-*
          path: collected/capital-flow
          merge-multiple: false
      - name: 生成全市场汇总并发送一条通知
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python research_signal_production_summary.py --input-root collected --output-dir output --notify true
      - name: 上传生产汇总artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-signal-production-summary
          path: output/
          retention-days: 30
          if-no-files-found: warn
