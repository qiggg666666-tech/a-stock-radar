    - cron: '5 11 * * *'    # 19:05 vegas-tunnel
    - cron: '15 11 * * *'   # 19:15 sector-flow-pcr
    - cron: '25 11 * * *'   # 19:25 multi-period-macd
    - cron: '30 11 * * *'   # 19:30 resonance-signal (收盘后)
    - cron: '35 11 * * *'   # 19:35 double-bottom
    - cron: '40 11 * * *'   # 19:40 yearline-limitup
    - cron: '45 11 * * *'   # 19:45 zt-pre (收盘后)
    - cron: '50 11 * * *'   # 19:50 alpha-signal-v7 (Part1)
    - cron: '55 11 * * *'   # 19:55 trend-judge (收盘后)
    - cron: '0 12 * * *'    # 20:00 daily-summary
    - cron: '5 12 * * *'    # 20:05 alpha-signal-v7-part2
    - cron: '0 3 1 * *'     # 每月1号 build-calibration

jobs:
  main-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Main Screener
        env: { SENDKEY: '${{ secrets.SENDKEY }}' }
        run: python main.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: main-screener-results, path: output/, retention-days: 30, if-no-files-found: warn }

  strong-continuation:
